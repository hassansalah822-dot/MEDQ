<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MEDQ | About the Developer</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2563EB">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen p-6 md:p-12 bg-slate-50 font-sans">
    <div class="max-w-3xl mx-auto">
        <a href="dashboard.html" class="inline-flex items-center gap-2 text-blue-600 font-bold mb-8 hover:underline"><i data-lucide="arrow-left"></i> Back to Dashboard</a>
        <div class="bg-white rounded-3xl shadow-lg border border-slate-200 overflow-hidden">
            <div class="bg-gradient-to-r from-blue-600 to-indigo-700 h-32"></div>
            <div class="px-8 pb-8 relative">
                <img id="profileImg" src="https://ui-avatars.com/api/?name=Developer&background=random&size=128" class="w-32 h-32 rounded-full border-4 border-white shadow-md absolute -top-16 bg-white object-cover">
                <div class="pt-20">
                    <h1 id="profileName" class="text-3xl font-extrabold text-slate-900 mb-1">Loading...</h1>
                    <p class="text-emerald-600 font-bold mb-6">Lead Developer & Medical Consultant</p>
                    <div class="bg-slate-50 p-6 rounded-2xl border border-slate-100 mb-8"><p id="profileBio" class="text-slate-600 leading-relaxed whitespace-pre-line"></p></div>
                    <div class="flex gap-4"><a href="https://wa.me/+249901879983" target="_blank" class="flex-1 bg-emerald-500 text-white font-bold py-3 rounded-xl flex justify-center items-center gap-2 shadow"><i data-lucide="message-circle"></i> WhatsApp</a><a href="mailto:salahaldin10111@gmail.com" class="flex-1 bg-slate-900 text-white font-bold py-3 rounded-xl flex justify-center items-center gap-2 shadow"><i data-lucide="mail"></i> Email</a></div>
                </div>
            </div>
        </div>
    </div>
    <script>lucide.createIcons();</script>
    <script type="module">
        import { db } from './js/firebase-config.js'; import { doc, getDoc } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";
        getDoc(doc(db, "system", "developer_profile")).then(s => { if(s.exists()){ const d=s.data(); document.getElementById('profileName').innerText=d.name; document.getElementById('profileBio').innerText=d.bio; if(d.image) document.getElementById('profileImg').src=d.image; }});
    </script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(registration => console.log('ServiceWorker registration successful with scope: ', registration.scope))
            .catch(err => console.log('ServiceWorker registration failed: ', err));
        });
      }
    </script>
</body>
</html>
